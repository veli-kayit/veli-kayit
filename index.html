<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAC Dil Kursu - Öğrenci Ön Kayıt Formu</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Öğrenci Ön Kayıt Formu</h2>
  <form id="basvuruFormu" onsubmit="formuGonder(event)">
    <div class="form-group">
      <label for="ogrenciAd">Öğrenci Adı Soyadı *</label>
      <input type="text" id="ogrenciAd" required placeholder="Örn: Ahmet Yılmaz">
    </div>

    <div class="form-group">
      <label for="ogrenciTc">Öğrenci T.C. Kimlik No *</label>
      <input type="text" id="ogrenciTc" maxlength="11" required placeholder="11 Haneli T.C. No">
    </div>

    <div class="form-group">
      <label for="ogrenciDogum">Doğum Tarihi</label>
      <input type="date" id="ogrenciDogum">
    </div>

    <div class="form-group">
      <label for="ogrenciSinif">Sınıfı / Seviyesi</label>
      <input type="text" id="ogrenciSinif" placeholder="Örn: 5. Sınıf veya İngilizce B1">
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <div class="form-group">
      <label for="veliAd">Veli Adı Soyadı *</label>
      <input type="text" id="veliAd" required placeholder="Örn: Mehmet Yılmaz">
    </div>

    <div class="form-group">
      <label for="veliTc">Veli T.C. Kimlik No</label>
      <input type="text" id="veliTc" maxlength="11" placeholder="11 Haneli T.C. No">
    </div>

    <div class="form-group">
      <label for="veliTel">Veli Telefon (WhatsApp) *</label>
      <input type="tel" id="veliTel" required placeholder="05XX XXX XX XX">
    </div>

    <div class="form-group">
      <label for="veliAdres">Ev / İş Adresi</label>
      <textarea id="veliAdres" rows="3" placeholder="Açık adresiniz"></textarea>
    </div>

    <button type="submit">Başvuruyu Gönder</button>
  </form>
</div>

<!-- FIREBASE VERİTABANI KÜTÜPHANELERİ -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
  // Firebase Yapılandırması
  const firebaseConfig = {
    apiKey: "AIzaSyAhV9Qy4ltYmkfMnVWqv_73...", // BURAYA TAM API KEY GELECEK
    authDomain: "tac-dil-kursu.firebaseapp.com",
    projectId: "tac-dil-kursu",
    storageBucket: "tac-dil-kursu.firebasestorage.app",
    messagingSenderId: "19768963872",
    appId: "1:19768963872:web:a869617de86...", // BURAYA TAM APP ID GELECEK
    measurementId: "G-H34RLJSKCJ"
  };

  // Firebase Başlatma
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const db = firebase.firestore();

  // Form Gönderim Fonksiyonu
  async function formuGonder(event) {
    event.preventDefault();

    const oAd = document.getElementById('ogrenciAd')?.value;
    const oTc = document.getElementById('ogrenciTc')?.value;
    const oDogum = document.getElementById('ogrenciDogum')?.value;
    const sinif = document.getElementById('ogrenciSinif')?.value;

    const vAd = document.getElementById('veliAd')?.value;
    const vTc = document.getElementById('veliTc')?.value;
    const vTel = document.getElementById('veliTel')?.value;
    const vAdres = document.getElementById('veliAdres')?.value;

    if (!oAd || !oTc || !vAd || !vTel) {
      alert("Lütfen tüm zorunlu (*) alanları doldurun.");
      return;
    }

    const yeniBasvuru = {
      oAd, oTc, oDogum, sinif, vAd, vTc, oTel: vTel, vTel, vAdres,
      durum: "ONAY_BEKLİYOR",
      kayitTarihi: new Date().toISOString()
    };

    try {
      await db.collection("ogrenciler").add(yeniBasvuru);
      alert("Kayıt başvurunuz başarıyla alındı!");
      document.getElementById('basvuruFormu').reset();
    } catch (error) {
      alert("Hata oluştu: " + error.message);
    }
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAC DİL KURSU - Online Kayıt Formu</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f4f7f6; padding: 15px; margin: 0; }
        .form-kutu { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .baslik { color: #c0392b; text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; color: #333; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-gonder { background: #27ae60; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-gonder:hover { background: #219150; }
        .basarili { display: none; background: #d4edda; color: #155724; padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="form-kutu">
    <div class="baslik">TAC DİL KURSU<br><small style="font-size: 14px; color: #555;">Online Ön Kayıt Formu</small></div>
    
    <div id="basariliMesaj" class="basarili">
        ✅ Kaydınız başarıyla alınmıştır! Kurs yönetimimiz sizinle en kısa sürede iletişime geçecektir.
    </div>

    <form id="onlineForm">
        <div class="form-group">
            <label>Öğrenci Adı Soyadı *</label>
            <input type="text" id="oAd" required>
        </div>
        <div class="form-group">
            <label>Öğrenci T.C. Kimlik No *</label>
            <input type="number" id="oTc" required>
        </div>
        <div class="form-group">
            <label>Doğum Tarihi</label>
            <input type="date" id="oDogum">
        </div>
        <div class="form-group">
            <label>Öğrenci Telefon No</label>
            <input type="tel" id="oTel">
        </div>
        <div class="form-group">
            <label>Sınıfı / Seviyesi *</label>
            <select id="sinif" required>
                <option value="">-- Seçiniz --</option>
                <option value="1. Sınıf">1. Sınıf</option>
                <option value="2. Sınıf">2. Sınıf</option>
                <option value="3. Sınıf">3. Sınıf</option>
                <option value="4. Sınıf">4. Sınıf</option>

                <option value="5. Sınıf">5. Sınıf</option>
                <option value="6. Sınıf">6. Sınıf</option>
                <option value="7. Sınıf">7. Sınıf</option>
                <option value="8. Sınıf (LGS)">8. Sınıf (LGS)</option>
                <option value="9. Sınıf">9. Sınıf</option>
                <option value="10. Sınıf">10. Sınıf</option>
                <option value="11. Sınıf">11. Sınıf</option>
                <option value="12. Sınıf (YKS)">12. Sınıf (YKS)</option>
                <option value="Mezun">Mezun</option>
                <option value="İngilizce Özel">İngilizce Özel</option>
            </select>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

        <div class="form-group">
            <label>Veli Adı Soyadı *</label>
            <input type="text" id="vAd" required>
        </div>
        <div class="form-group">
            <label>Veli T.C. Kimlik No *</label>
            <input type="number" id="vTc" required>
        </div>
        <div class="form-group">
            <label>Veli Telefon No *</label>
            <input type="tel" id="vTel" required>
        </div>
        <div class="form-group">
            <label>Veli Adresi *</label>
            <textarea id="vAdres" rows="2" required></textarea>
        </div>

        <button type="submit" class="btn-gonder">ÖN KAYDI TAMAMLA</button>
    </form>
</div>

<script>
    // Firebase Bağlantı Yapılandırması
    const firebaseConfig = {
        apiKey: "AIzaSyDummyKeyForSecurity",
        authDomain: "tac-dil-kursu.firebaseapp.com",
        projectId: "tac-dil-kursu",
        storageBucket: "tac-dil-kursu.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abc123def456"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Form Gönderme İşlemi
    document.getElementById('onlineForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const oAd = document.getElementById('oAd').value.trim();
        const oTc = document.getElementById('oTc').value.trim();
        const oDogum = document.getElementById('oDogum').value;
        const oTel = document.getElementById('oTel').value.trim();
        const sinif = document.getElementById('sinif').value;
        const vAd = document.getElementById('vAd').value.trim();
        const vTc = document.getElementById('vTc').value.trim();
        const vTel = document.getElementById('vTel').value.trim();
        const vAdres = document.getElementById('vAdres').value.trim();

        if(!oAd || !oTc || !vAd || !vTc || !vTel || !vAdres || !sinif) {
            alert('Lütfen tüm zorunlu alanları doldurunuz.');
            return;
        }

        const yeniOgrenci = {
            id: Date.now(),
            oAd, oTc, oDogum, oTel, sinif,
            vAd, vTc, vTel, vAdres,
            tUcret: 0, 
            taksitS: 1,
            taksitT: 0,
            onlineKayit: true,
            durum: "onay_bekliyor" // Kaydın doğrudan onaylılara değil, onay bekleyenlere düşmesini sağlar
        };

        try {
            await db.collection("ogrenciler").add(yeniOgrenci);
            document.getElementById('onlineForm').reset();
            document.getElementById('basariliMesaj').style.display = 'block';
            window.scrollTo(0, 0);
        } catch (error) {
            alert("Kayıt sırasında bir hata oluştu: " + error.message);
        }
    });
</script>

</body>
</html>

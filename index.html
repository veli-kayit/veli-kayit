<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAC DİL KURSU - ÖĞRENCİ KAYIT FORMU</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a365d; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .section-title { font-weight: bold; color: #2b6cb0; margin-top: 15px; margin-bottom: 10px; display: block; }
        label { font-size: 14px; color: #4a5568; display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background-color: #2b6cb0; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #2c5282; }
        .success-msg { display: none; background: #c6f6d5; color: #22543d; padding: 15px; border-radius: 6px; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>TAC DİL KURSU<br><small style="font-size:14px; color:#718096;">Öğrenci Ön Kayıt Formu</small></h2>
    
    <form id="studentForm">
        <span class="section-title">🎓 Öğrenci Bilgileri</span>
        <label>Öğrenci Adı Soyadı *</label>
        <input type="text" id="ogrenciAd" required>

        <label>Öğrenci T.C. Kimlik No *</label>
        <input type="text" id="ogrenciTc" maxlength="11" required>

        <label>Öğrenci Doğum Tarihi *</label>
        <input type="date" id="ogrenciDogum" required>

        <label>Öğrenci Telefon No (Varsa)</label>
        <input type="tel" id="ogrenciTel" placeholder="05XX XXX XX XX">

        <span class="section-title" style="margin-top:25px;">👨‍👩‍👧 Veli Bilgileri</span>
        <label>Veli Adı Soyadı *</label>
        <input type="text" id="veliAd" required>

        <label>Veli T.C. Kimlik No *</label>
        <input type="text" id="veliTc" maxlength="11" required>

        <label>Veli Telefon No *</label>
        <input type="tel" id="veliTel" placeholder="05XX XXX XX XX" required>

        <label>Ev Adresi *</label>
        <textarea id="evAdresi" rows="3" required></textarea>

        <button type="button" onclick="formuGonder()">Kaydı Tamamla</button>
    </form>

    <div id="basariMesaji" class="success-msg">
        ✅ Bilgileriniz başarıyla alındı! Kurs yönetimimiz sizinle iletişime geçecektir.
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "FIREBASE_API_KEY",
        authDomain: "PROJECT_ID.firebaseapp.com",
        databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "PROJECT_ID",
        storageBucket: "PROJECT_ID.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function formuGonder() {
        const ogrenciAd = document.getElementById('ogrenciAd').value.trim();
        const ogrenciTc = document.getElementById('ogrenciTc').value.trim();
        const ogrenciDogum = document.getElementById('ogrenciDogum').value;
        const ogrenciTel = document.getElementById('ogrenciTel').value.trim();
        const veliAd = document.getElementById('veliAd').value.trim();
        const veliTc = document.getElementById('veliTc').value.trim();
        const veliTel = document.getElementById('veliTel').value.trim();
        const evAdresi = document.getElementById('evAdresi').value.trim();

        if(!ogrenciAd || !ogrenciTc || !veliAd || !veliTel) {
            alert("Lütfen zorunlu alanları doldurunuz!");
            return;
        }

        const yeniOgrenciRef = database.ref('ogrenciler').push();
        yeniOgrenciRef.set({
            ogrenciAd: ogrenciAd,
            ogrenciTc: ogrenciTc,
            ogrenciDogum: ogrenciDogum,
            ogrenciTel: ogrenciTel,
            veliAd: veliAd,
            veliTc: veliTc,
            veliTel: veliTel,
            evAdresi: evAdresi,
            kayitTarihi: new Date().toISOString(),
            durum: "Veli Kaydı (Onay Bekliyor)"
        }).then(() => {
            document.getElementById('studentForm').style.display = 'none';
            document.getElementById('basariMesaji').style.display = 'block';
        }).catch((error) => {
            alert("Hata oluştu: " + error.message);
        });
    }
</script>
<!-- WhatsApp Butonu -->
<div style="margin: 20px 0; text-align: center;">
    <button onclick="whatsappKayitLinkiGonder()" style="background-color: #25D366; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px;">
        📲 Veliye Kayıt Formu Linki Gönder
    </button>
</div>

<script>
function whatsappKayitLinkiGonder() {
    const formUrl = "https://veli-kayit.github.io/veli-kayit/"; 
    const mesaj = `Sayın Velimiz, TAC Dil Kursu kayıt işlemlerinizin tamamlanabilmesi için lütfen aşağıdaki bağlantıya tıklayarak formu doldurunuz:\n\n${formUrl}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(mesaj)}`, '_blank');
}
</script>

</body>
</html>
